# FRONTEND: Nginx sirve la SPA estática y reenvía /api/ al contenedor BACKEND.
# Escucha en 8080 (imagen "unprivileged": no corre como root).

map $http_x_forwarded_proto $proto_cliente {
    default $http_x_forwarded_proto;
    ''      $scheme;
}

server {
    listen 8080;
    server_name _;
    server_tokens off;
    client_max_body_size 20k;

    root /usr/share/nginx/html;
    index index.html;

    # Cabeceras de seguridad a nivel de servidor (no usar add_header dentro de location:
    # eso anula la herencia y las cabeceras se perderían).
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), camera=(), microphone=()" always;
    add_header X-Frame-Options "DENY" always;

    location = /nginx-health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # API -> backend. DNS interno de Docker + variable: Nginx vuelve a resolver "backend"
    # si ese contenedor se reinicia y cambia de IP.
    resolver 127.0.0.11 valid=10s ipv6=off;
    location /api/ {
        set $upstream_backend http://backend:3000;
        proxy_pass $upstream_backend;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $proto_cliente;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }

    location ~* \.(css|js|png|jpg|jpeg|svg|ico|webp)$ {
        try_files $uri =404;
        expires 1h;
    }

    location / {
        try_files $uri /index.html;
    }
}

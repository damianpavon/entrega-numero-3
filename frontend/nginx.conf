# FRONTEND: Nginx sirve los archivos estáticos (CSS, JS, imágenes, vendors) y
# reenvía el resto (páginas EJS, carrito, login, /health) al contenedor BACKEND.
# Escucha en 8080 (imagen "unprivileged": no corre como root).

map $http_x_forwarded_proto $proto_cliente {
    default $http_x_forwarded_proto;
    ''      $scheme;
}

server {
    listen 8080;
    server_name _;
    server_tokens off;
    client_max_body_size 20k;

    root /usr/share/nginx/html;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Salud del propio frontend (healthcheck de Docker)
    location = /nginx-health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Estáticos servidos directamente por Nginx
    location ~ ^/(css|js|img|imagenes|vendors)/ {
        try_files $uri =404;
        expires 7d;
        add_header Cache-Control "public";
        add_header X-Content-Type-Options "nosniff" always;
    }

    # Todo lo demás -> backend Node.js
    location / {
        proxy_pass http://backend:3000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $proto_cliente;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }
}

# AMBIENTE 1: DESARROLLO
#   cp docker/env/dev.env.example docker/env/dev.env
#   docker compose --env-file docker/env/dev.env -f docker/docker-compose.dev.yml up --build
# Abrir http://localhost:8080  (el backend recarga solo al editar backend/src)
name: carta-dev
services:
  frontend:
    build:
      context: ../frontend
    ports:
      - "8080:8080"
    volumes:
      - ../frontend/public:/usr/share/nginx/html:ro   # editar HTML/CSS/JS sin reconstruir
    depends_on:
      backend:
        condition: service_healthy
  backend:
    build:
      context: ../backend
    env_file: ./env/dev.env
    command: ["node", "--watch", "src/server.js"]
    volumes:
      - ../backend/src:/app/src:ro
    depends_on:
      db:
        condition: service_healthy
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata-dev:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  pgdata-dev:

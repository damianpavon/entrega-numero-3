# AMBIENTE 2: QA (pruebas, imágenes construidas igual que producción)
#   cp docker/env/qa.env.example docker/env/qa.env   (y cambiar los secretos)
#   docker compose --env-file docker/env/qa.env -f docker/docker-compose.qa.yml up -d --build
# Abrir http://localhost:8081
name: carta-qa
services:
  frontend:
    build:
      context: ../frontend
    ports:
      - "8081:8080"
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
  backend:
    build:
      context: ../backend
    env_file: ./env/qa.env
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - pgdata-qa:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  pgdata-qa:

# AMBIENTE 3: PRODUCCIÓN
# En AWS la base es RDS y los contenedores frontend + backend los ejecutan las instancias
# del Auto Scaling Group (ver infra/aws). Este compose sirve para producción en UN servidor
# o para ensayar localmente:
#   - sin BD local (RDS u otra):  docker compose --env-file docker/env/prod.env -f docker/docker-compose.prod.yml up -d --build
#   - con BD en contenedor:       ... --profile db-local up -d --build   (DB_HOST=db)
name: carta-prod
x-endurecido: &endurecido
  restart: always
  read_only: true
  tmpfs:
    - /tmp
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
services:
  frontend:
    <<: *endurecido
    build:
      context: ../frontend
    ports:
      - "80:8080"
    tmpfs:
      - /tmp
      - /var/cache/nginx
    depends_on:
      backend:
        condition: service_healthy
  backend:
    <<: *endurecido
    build:
      context: ../backend
    env_file: ./env/prod.env
    depends_on:
      db:
        condition: service_healthy
        required: false
    deploy:
      resources:
        limits:
          memory: 512M
  db:
    profiles: ["db-local"]
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - pgdata-prod:/var/lib/postgresql/data
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  pgdata-prod:
